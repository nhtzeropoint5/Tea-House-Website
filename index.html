<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
  * {
  font-family: "Manrope", sans-serif;
  }

  </style>
</head>


<body>
<!-- banner section -->
<section class="grid grid-cols-1 md:grid-cols-2 container mx-auto items-center">

  <!-- Left -->
  <div class="banner-left space-y-[30px]">
    <h2 class="text-[80px] font-bold">
      It's good <br> tea time at The <br> Tea House
    </h2>

    <p>
      Lorem ipsum dolor sit amet consectetur <br>
      adipisicing elit. Magni, rerum!
    </p>

    <button
      class="py-3 px-5 rounded-md text-white font-semibold 
             bg-linear-to-r from-[#ff8938] to-[#ff0000]">
      Explore more
      <span class="inline-block -rotate-45">
        <i class="fa-solid fa-arrow-right-long"></i>
      </span>
    </button>
  </div>

  <!-- Right -->
  <div class="banner-right flex justify-end items-end relative">

    <img src="./images/banner.png" alt="">

    <!-- Rating Card -->
    <div
      class="absolute bottom-6 left-6 bg-white rounded-xl shadow-2xl 
             flex items-center gap-4 p-4">

      <img src="./images/star.png" alt="star" class="w-12 h-12">

      <div>
        <h2 class="font-bold text-2xl">5.00</h2>
        <p class="text-sm text-gray-500">
          Trust Pilot Ratings
        </p>
      </div>

    </div>

  </div>
</section>











<script src="script.js"></script>
</body>
</html>
